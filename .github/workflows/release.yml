name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (e.g. 0.12.0 or v0.12.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-backend
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-helm:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Normalize registry namespace
        shell: bash
        run: echo "OCI_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION="${VERSION#v}"
          BACKEND_IMAGE="${{ env.REGISTRY }}/${OCI_NAMESPACE}/securo-backend"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${OCI_NAMESPACE}/securo-frontend"

          echo "Injecting fork image references and version $VERSION"
          sed -i "s|ghcr.io/securo-finance/securo-backend:latest|${BACKEND_IMAGE}:${VERSION}|g" charts/securo/Chart.yaml
          sed -i "s|ghcr.io/securo-finance/securo-frontend:latest|${FRONTEND_IMAGE}:${VERSION}|g" charts/securo/Chart.yaml
          sed -i "s|repository: ghcr.io/securo-finance/securo-backend|repository: ${BACKEND_IMAGE}|g" charts/securo/values.yaml
          sed -i "s|repository: ghcr.io/securo-finance/securo-frontend|repository: ${FRONTEND_IMAGE}|g" charts/securo/values.yaml
          sed -i "s|tag: latest|tag: ${VERSION}|g" charts/securo/values.yaml

          echo "Packaging chart version $VERSION"
          helm package charts/securo --version "$VERSION" --app-version "$VERSION"

          helm push "securo-$VERSION.tgz" "oci://${{ env.REGISTRY }}/${OCI_NAMESPACE}/charts"

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub Metadata
        shell: bash
        run: |
          oras push "${{ env.REGISTRY }}/${OCI_NAMESPACE}/charts/securo:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/securo/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
